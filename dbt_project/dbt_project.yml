name: 'dgssi_warehouse'
version: '1.0.0'
config-version: 2

profile: 'dgssi_warehouse'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dgssi_warehouse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
      dim_chapitre:
        +enabled: false

seeds:
  dgssi_warehouse:
    chapitres_dnssi_ref:
      +schema: marts
      +column_types:
        chapitre_dnssi_id: integer
        code_chapitre: varchar(10)
        nom_chapitre: varchar(200)
        domaine: varchar(100)
