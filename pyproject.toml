[project]
name = "dgssi-platform"
version = "0.1.0"
description = "Plateforme d'ingénierie et d'analyse des données réglementaires — DGSSI"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "black>=24.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-PyYAML>=6.0",
]
database = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9", "alembic>=1.13"]
storage = ["boto3>=1.34"]
extraction = ["docling>=2.0", "pytesseract>=0.3", "pillow>=10.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgssi_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=dgssi_platform --cov-report=term-missing"